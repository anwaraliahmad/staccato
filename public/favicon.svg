<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#grad1)" opacity="0.9"/>
  
  <!-- Music note -->
  <g fill="white" filter="url(#glow)">
    <!-- Note head -->
    <ellipse cx="35" cy="60" rx="8" ry="6"/>
    
    <!-- Stem -->
    <rect x="42" y="30" width="3" height="30"/>
    
    <!-- Flag -->
    <path d="M 45 30 Q 55 25 60 30 Q 55 35 45 30"/>
    
    <!-- Eighth note -->
    <ellipse cx="25" cy="45" rx="6" ry="4"/>
    <rect x="30" y="25" width="2" height="20"/>
    <path d="M 32 25 Q 40 20 45 25 Q 40 30 32 25"/>
  </g>
  
  <!-- Audio waves -->
  <g stroke="white" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 10 80 Q 20 75 30 80 Q 40 85 50 80 Q 60 75 70 80 Q 80 85 90 80"/>
    <path d="M 10 85 Q 20 80 30 85 Q 40 90 50 85 Q 60 80 70 85 Q 80 90 90 85"/>
  </g>
</svg>